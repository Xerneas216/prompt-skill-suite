name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_release.py --output-dir build-release
      - name: Compare rebuilt release with committed checksum
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          checksum = Path("dist/procraft-v0.3.0.zip.sha256").read_text(encoding="ascii")
          expected, filename = checksum.split()
          if filename != "procraft-v0.3.0.zip":
              raise SystemExit(f"Unexpected checksum filename: {filename}")
          actual = hashlib.sha256(Path("build-release/procraft-v0.3.0.zip").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Release checksum mismatch: {actual} != {expected}")
